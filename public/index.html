<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>エマの漢字と九九</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23ff4f93'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div class="world" aria-hidden="true">
    <span class="deco d1">🧁</span>
    <span class="deco d2">🌸</span>
    <span class="deco d3">⭐</span>
    <span class="deco d4">🐰</span>
    <span class="deco d5">✨</span>
    <span class="deco d6">🧁</span>
  </div>
  <button type="button" id="muteBtn" class="mute">🔊 おと あり</button>

  <main class="card">
    <section id="home">
      <div class="cute-row" aria-hidden="true">🧁 ✨ 🐰 ✨ 🌸</div>
      <div class="banner">★ きょうも がんばろう！ ★</div>
      <h1 class="title">
        <span class="pink">エマ</span><br>
        <span class="purple">の かんじと</span><br>
        <span class="gold">九九</span>
      </h1>
      <div class="pills">
        <span>📖 かんじ</span>
        <span>🔢 九九</span>
      </div>
      <button type="button" id="startBtn" class="start">はじめる</button>
      <p class="credit">かきじゅんのデータは KanjiVG（CC BY-SA）</p>
    </section>

    <section id="play" hidden>
      <div class="banner">しゃしん あそび</div>
      <div class="cakes" id="cakes" aria-hidden="true">🧁🧁🧁🧁🧁</div>
      <div class="timer" id="timer">5:00</div>
      <div class="soon" id="soon" hidden>もうすぐ べんきょうだよ</div>
      <p class="note" id="playNote">5ぷん あそぼう</p>
      <div class="stage" id="stage">
        <video id="video" playsinline autoplay muted hidden></video>
        <canvas id="photoCanvas" width="640" height="360"></canvas>
        <div class="sparkle-layer" id="sparkleLayer" hidden></div>
        <canvas id="playInk" width="640" height="360"></canvas>
      </div>
      <div class="play-actions">
        <button type="button" id="captureBtn" class="btn pink">しゃしん</button>
        <label class="btn purple file-btn" for="fileInput">えらぶ</label>
        <input id="fileInput" type="file" accept="image/*" hidden>
        <button type="button" id="resetBtn" class="btn amber">もどす</button>
      </div>
      <div class="styles" id="styleRow">
        <button type="button" class="chip picked" data-style="normal">そのまま</button>
        <button type="button" class="chip" data-style="bright">あかるく</button>
        <button type="button" class="chip" data-style="toon">アニメっぽい</button>
        <button type="button" class="chip" data-style="sparkle">キラキラ</button>
      </div>
      <div class="stickers" id="toolRow">
        <button type="button" class="chip picked" data-tool="draw">かく</button>
        <button type="button" class="chip" data-tool="🧁" aria-label="シール カップケーキ">🧁</button>
        <button type="button" class="chip" data-tool="⭐" aria-label="シール ほし">⭐</button>
        <button type="button" class="chip" data-tool="🐰" aria-label="シール うさぎ">🐰</button>
        <button type="button" class="chip" data-tool="🌸" aria-label="シール はな">🌸</button>
        <button type="button" class="chip" data-tool="💛" aria-label="シール ハート">💛</button>
      </div>
      <div class="play-actions">
        <button type="button" id="clearPlay" class="btn amber">けす</button>
        <button type="button" id="savePlay" class="btn blue">ほぞん</button>
      </div>
      <button type="button" id="playBack" class="btn blue back">もどる</button>
    </section>

    <section id="study" hidden>
      <div class="banner" id="modeTitle">かんじ</div>
      <p class="prompt" id="prompt">きいて、かんじを かこう</p>
      <p class="unit-mark" id="unitMark" hidden></p>
      <div class="question" id="question" hidden>2 × 3</div>
      <p class="reading" id="reading" hidden></p>
      <div class="masu" id="kanjiBoard">
        <div class="grid-v"></div>
        <div class="grid-h"></div>
        <canvas id="kanjiGuide" width="300" height="300"></canvas>
        <svg id="strokeSvg" class="stroke-svg" viewBox="0 0 109 109" aria-hidden="true"></svg>
        <canvas id="kanjiInk" width="300" height="300"></canvas>
      </div>
      <div class="math-board" id="mathBoard" hidden>
        <div class="baseline"></div>
        <canvas id="mathGuide" width="420" height="240"></canvas>
        <canvas id="mathInk" width="420" height="240"></canvas>
      </div>
      <div class="feedback" id="feedback" aria-live="polite"></div>
      <div class="actions">
        <button type="button" id="clearBtn" class="btn amber">けす</button>
        <button type="button" id="doneBtn" class="btn green">できた</button>
        <button type="button" id="skipBtn" class="btn pink">あとで</button>
      </div>
      <div class="listen">
        <div>
          <button type="button" id="speakBtn" class="speak" aria-label="きく">🔊</button>
          <div class="hint-label">きく</div>
        </div>
        <button type="button" id="songBtn" class="btn purple" hidden>九九のうた</button>
        <button type="button" id="bgmBtn" class="btn purple" hidden>おんがく とめる</button>
        <button type="button" id="strokeBtn" class="btn pink" hidden>かきじゅん</button>
      </div>
      <div class="progress" id="progress">あと 8 もん</div>
      <button type="button" id="backBtn" class="btn blue back">もどる</button>
    </section>

    <section id="done" hidden>
      <div class="cute-row" aria-hidden="true">🧁 ✨ 🌸</div>
      <div class="done-mark" aria-hidden="true">✨</div>
      <h2 class="done-title">すごい！じょうず！</h2>
      <p class="done-lead" id="doneLead">エマ、がんばったね</p>
      <button type="button" id="againBtn" class="start">もういちど</button>
      <button type="button" id="homeBtn" class="btn blue back">おわる</button>
    </section>
  </main>

  <script src="curriculum.js"></script>
  <script src="strokes.js"></script>
  <script src="sound.js"></script>
  <script src="app.js"></script>
</body>
</html>
