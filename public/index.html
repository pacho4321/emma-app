<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>エマの漢字と九九</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Hiragino Maru Gothic Pro", "Yu Gothic", sans-serif;
      background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .card {
      background: white;
      border-radius: 28px;
      padding: 20px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.12);
      max-width: 400px;
      width: 100%;
      text-align: center;
    }
    .header {
      background: #ffd54f;
      border-radius: 16px;
      padding: 12px 16px;
      margin-bottom: 16px;
      font-weight: bold;
      font-size: 22px;
      color: #333;
    }
    .home-title {
      font-size: 28px;
      margin: 10px 0 6px;
      color: #333;
    }
    .home-sub {
      font-size: 18px;
      color: #666;
      margin-bottom: 20px;
    }
    .big-btn {
      display: block;
      width: 100%;
      background: #ff9800;
      color: white;
      border: none;
      border-radius: 20px;
      font-size: 22px;
      font-weight: bold;
      padding: 16px;
      margin: 10px 0;
      cursor: pointer;
    }
    .big-btn.green { background: #4caf50; }
    .info {
      font-size: 15px;
      color: #555;
      margin-bottom: 8px;
      line-height: 1.4;
    }
    .kanji-big {
      font-size: 72px;
      font-weight: bold;
      color: #222;
      margin: 4px 0 12px;
    }
    .write-label {
      font-size: 18px;
      font-weight: bold;
      color: #333;
      margin-bottom: 8px;
    }
    #canvas {
      border: 3px solid #e0e0e0;
      border-radius: 18px;
      background: #fafafa;
      touch-action: none;
      margin: 0 auto 12px;
      display: block;
      cursor: crosshair;
    }
    .btn {
      border: none;
      border-radius: 18px;
      font-size: 20px;
      font-weight: bold;
      padding: 12px 18px;
      cursor: pointer;
      margin: 4px;
    }
    .ok-btn { background: #4caf50; color: white; }
    .clear-btn { background: #bdbdbd; color: white; }
    .back-btn { background: #90caf9; color: white; }
    .unknown-btn { background: #7e57c2; color: white; }
    .speak-btn {
      background: #ff9800;
      color: white;
      width: 64px;
      height: 64px;
      border-radius: 50%;
      font-size: 28px;
      display: block;
      margin: 12px auto 4px;
      border: none;
      cursor: pointer;
    }
    .next-small {
      background: #ffb74d;
      color: white;
      border: none;
      border-radius: 16px;
      font-size: 16px;
      padding: 8px 14px;
      margin: 6px;
      cursor: pointer;
    }
    .feedback {
      font-size: 24px;
      margin: 10px 0 4px;
      min-height: 32px;
      font-weight: bold;
    }
    .feedback.good { color: #4caf50; }
    .progress {
      margin-top: 8px;
      font-size: 15px;
      color: #777;
    }
    .done {
      font-size: 48px;
      color: #4caf50;
      margin: 30px 0;
    }
    .buttons {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 6px;
      flex-wrap: wrap;
    }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="card" id="app">
    <!-- Home -->
    <div id="home">
      <div class="header">エマの漢字と九九</div>
      <div class="home-title">今日もがんばろう！</div>
      <div class="home-sub">楽しく練習しよう</div>
      <button class="big-btn" id="startKanji">漢字を練習</button>
      <button class="big-btn green" id="startMath">九九を練習</button>
    </div>

    <!-- Practice -->
    <div id="practice" class="hidden">
      <div class="header" id="modeTitle">漢字</div>
      <div class="info" id="info"></div>
      <div class="kanji-big" id="kanji"></div>
      <div class="write-label" id="question">かいてみよう</div>
      <canvas id="canvas" width="280" height="180"></canvas>
      <div class="buttons">
        <button class="btn clear-btn" id="clearBtn">きれい</button>
        <button class="btn ok-btn" id="okBtn">OK</button>
        <button class="btn unknown-btn" id="unknownBtn">わからない</button>
      </div>
      <button class="speak-btn" id="speakBtn" title="きく">🔊</button>
      <button class="next-small" id="nextBtn">つぎ</button>
      <div class="feedback" id="feedback"></div>
      <div class="progress" id="progress"></div>
      <button class="btn back-btn" id="backBtn" style="margin-top:12px;">もどる</button>
    </div>
  </div>

  <script>
    const KANJI_LIST = [
      { kanji: "一", reading: "いち", speak: "いち" },
      { kanji: "二", reading: "に", speak: "に" },
      { kanji: "三", reading: "さん", speak: "さん" },
      { kanji: "四", reading: "し / よん", speak: "し" },
      { kanji: "五", reading: "ご", speak: "ご" },
      { kanji: "六", reading: "ろく", speak: "ろく" },
      { kanji: "七", reading: "なな / しち", speak: "なな" },
      { kanji: "八", reading: "はち", speak: "はち" },
      { kanji: "九", reading: "きゅう / く", speak: "きゅう" },
      { kanji: "十", reading: "じゅう", speak: "じゅう" }
    ];

    const MATH_LIST = [
      { kanji: "一", q: "1 × 1 = ?", speak: "いちかけるいちは" },
      { kanji: "二", q: "2 × 2 = ?", speak: "にかけるには" },
      { kanji: "三", q: "3 × 1 = ?", speak: "さんかけるいちは" },
      { kanji: "四", q: "2 × 3 = ?", speak: "にかけるさんは" },
      { kanji: "五", q: "5 × 1 = ?", speak: "ごかけるいちは" },
      { kanji: "六", q: "3 × 2 = ?", speak: "さんかけるには" },
      { kanji: "七", q: "7 × 1 = ?", speak: "ななかけるいちは" },
      { kanji: "八", q: "4 × 2 = ?", speak: "しかけるには" },
      { kanji: "九", q: "3 × 3 = ?", speak: "さんかけるさんは" },
      { kanji: "十", q: "5 × 2 = ?", speak: "ごかけるには" }
    ];

    let mode = "kanji";
    let queue = [];
    let current = null;
    let correctCount = 0;
    let total = 0;
    let showingGuide = false;

    const homeEl = document.getElementById("home");
    const practiceEl = document.getElementById("practice");
    const modeTitle = document.getElementById("modeTitle");
    const infoEl = document.getElementById("info");
    const kanjiEl = document.getElementById("kanji");
    const questionEl = document.getElementById("question");
    const feedbackEl = document.getElementById("feedback");
    const progressEl = document.getElementById("progress");
    const okBtn = document.getElementById("okBtn");
    const nextBtn = document.getElementById("nextBtn");
    const speakBtn = document.getElementById("speakBtn");
    const clearBtn = document.getElementById("clearBtn");
    const unknownBtn = document.getElementById("unknownBtn");
    const backBtn = document.getElementById("backBtn");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    let drawing = false;
    ctx.lineWidth = 7;
    ctx.lineCap = "round";
    ctx.strokeStyle = "#222";

    function speak(text) {
      if (!text) return;
      speechSynthesis.cancel();
      const uttr = new SpeechSynthesisUtterance(text);
      uttr.lang = "ja-JP";
      uttr.rate = 0.9;
      speechSynthesis.speak(uttr);
    }

    function getPos(e) {
      const rect = canvas.getBoundingClientRect();
      const touch = e.touches ? e.touches[0] : e;
      return { x: touch.clientX - rect.left, y: touch.clientY - rect.top };
    }

    function startDraw(e) {
      drawing = true;
      const pos = getPos(e);
      ctx.beginPath();
      ctx.moveTo(pos.x, pos.y);
    }

    function draw(e) {
      if (!drawing) return;
      e.preventDefault();
      const pos = getPos(e);
      ctx.lineTo(pos.x, pos.y);
      ctx.stroke();
    }

    function stopDraw() { drawing = false; }

    canvas.addEventListener("mousedown", startDraw);
    canvas.addEventListener("mousemove", draw);
    canvas.addEventListener("mouseup", stopDraw);
    canvas.addEventListener("mouseleave", stopDraw);
    canvas.addEventListener("touchstart", startDraw, { passive: false });
    canvas.addEventListener("touchmove", draw, { passive: false });
    canvas.addEventListener("touchend", stopDraw);

    function clearCanvas() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      showingGuide = false;
    }

    clearBtn.onclick = clearCanvas;

    function showGuide() {
      if (!current || mode !== "kanji") return;
      clearCanvas();
      ctx.save();
      ctx.globalAlpha = 0.25;
      ctx.fillStyle = "#888";
      ctx.font = "bold 100px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(current.kanji, canvas.width / 2, canvas.height / 2);
      ctx.restore();
      showingGuide = true;
      questionEl.textContent = "なぞってみよう！";
    }

    unknownBtn.onclick = showGuide;

    function showHome() {
      homeEl.classList.remove("hidden");
      practiceEl.classList.add("hidden");
    }

    function startPractice(newMode) {
      mode = newMode;
      queue = mode === "kanji" ? [...KANJI_LIST] : [...MATH_LIST];
      correctCount = 0;
      total = queue.length;
      homeEl.classList.add("hidden");
      practiceEl.classList.remove("hidden");
      loadNext();
    }

    document.getElementById("startKanji").onclick = () => startPractice("kanji");
    document.getElementById("startMath").onclick = () => startPractice("math");
    backBtn.onclick = showHome;

    function loadNext() {
      if (queue.length === 0) {
        showDone();
        return;
      }
      current = queue.shift();
      kanjiEl.textContent = current.kanji;
      if (mode === "kanji") {
        infoEl.textContent = `${current.kanji} （${current.reading}）`;
        questionEl.textContent = "かいてみよう";
        modeTitle.textContent = "漢字を練習";
        unknownBtn.style.display = "inline-block";
      } else {
        infoEl.textContent = current.kanji;
        questionEl.textContent = current.q;
        modeTitle.textContent = "九九を練習";
        unknownBtn.style.display = "none";
      }
      clearCanvas();
      feedbackEl.textContent = "";
      feedbackEl.className = "feedback";
      updateProgress();
    }

    function updateProgress() {
      progressEl.textContent = `すすんできた：${correctCount} / ${total}`;
    }

    function showDone() {
      practiceEl.innerHTML = `
        <div class="done">✔</div>
        <div class="home-title">すごい！じょうず！</div>
        <div class="home-sub">エマ、かんばったね</div>
        <button class="big-btn" onclick="location.reload()">もういちど</button>
      `;
    }

    const niceMessages = ["すごい！", "じょうず！", "いいね！", "がんばった！", "すてき！"];

    okBtn.onclick = () => {
      if (!current) return;
      const msg = niceMessages[Math.floor(Math.random() * niceMessages.length)];
      feedbackEl.textContent = msg;
      feedbackEl.className = "feedback good";
      correctCount++;
      setTimeout(loadNext, 700);
    };

    nextBtn.onclick = () => {
      if (!current) return;
      queue.push(current);
      loadNext();
    };

    speakBtn.onclick = () => {
      if (!current) return;
      const text = current.speak || current.reading || current.q;
      speak(text);
    };

    showHome();
  </script>
</body>
</html>
