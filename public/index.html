<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Emma Kanji Math</title>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Hiragino Maru Gothic Pro", "Yu Gothic", sans-serif;
      background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: white;
      border-radius: 30px;
      padding: 30px 20px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.15);
      max-width: 420px;
      width: 100%;
      text-align: center;
    }
    .kanji {
      font-size: 80px;
      font-weight: bold;
      color: #333;
      margin: 10px 0;
    }
    .question {
      font-size: 22px;
      margin: 15px 0 15px;
      color: #444;
    }
    #canvas {
      border: 3px solid #ddd;
      border-radius: 20px;
      background: #fafafa;
      touch-action: none;
      margin: 10px auto;
      display: block;
      cursor: crosshair;
    }
    .ok-btn, .next-btn, .clear-btn {
      border: none;
      border-radius: 20px;
      font-size: 24px;
      font-weight: bold;
      padding: 14px 0;
      cursor: pointer;
      margin: 6px;
    }
    .ok-btn {
      background: #4caf50;
      color: white;
      width: 140px;
    }
    .clear-btn {
      background: #9e9e9e;
      color: white;
      width: 140px;
    }
    .next-btn {
      background: #ff9800;
      color: white;
      width: 70px;
      height: 70px;
      border-radius: 50%;
      font-size: 36px;
      margin: 10px auto;
      display: block;
    }
    .feedback {
      font-size: 24px;
      margin: 15px 0;
      min-height: 30px;
      font-weight: bold;
    }
    .feedback.correct { color: #4caf50; }
    .feedback.wrong { color: #f44336; }
    .progress {
      margin-top: 15px;
      font-size: 16px;
      color: #666;
    }
    .done {
      font-size: 48px;
      color: #4caf50;
      margin: 30px 0;
    }
    .buttons {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="card" id="app">
    <div class="kanji" id="kanji">一</div>
    <div class="question" id="question">1 + 1 = ?</div>
    <canvas id="canvas" width="300" height="180"></canvas>
    <div class="buttons">
      <button class="clear-btn" id="clearBtn">Clear</button>
      <button class="ok-btn" id="okBtn">OK</button>
    </div>
    <button class="next-btn" id="nextBtn" title="Skip">▶</button>
    <div class="feedback" id="feedback"></div>
    <div class="progress" id="progress"></div>
  </div>

  <script>
    const QUESTIONS = [
      { kanji: "一", q: "1 + 1 = ?", a: "2" },
      { kanji: "二", q: "2 + 2 = ?", a: "4" },
      { kanji: "三", q: "3 + 1 = ?", a: "4" },
      { kanji: "四", q: "2 + 2 = ?", a: "4" },
      { kanji: "五", q: "3 + 2 = ?", a: "5" },
      { kanji: "六", q: "3 + 3 = ?", a: "6" },
      { kanji: "七", q: "4 + 3 = ?", a: "7" },
      { kanji: "八", q: "4 + 4 = ?", a: "8" },
      { kanji: "九", q: "5 + 4 = ?", a: "9" },
      { kanji: "十", q: "5 + 5 = ?", a: "10" }
    ];

    let queue = [...QUESTIONS];
    let current = null;
    let correctCount = 0;
    let total = QUESTIONS.length;
    let recognizing = false;

    const kanjiEl = document.getElementById("kanji");
    const questionEl = document.getElementById("question");
    const feedbackEl = document.getElementById("feedback");
    const progressEl = document.getElementById("progress");
    const okBtn = document.getElementById("okBtn");
    const nextBtn = document.getElementById("nextBtn");
    const clearBtn = document.getElementById("clearBtn");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    // Drawing setup
    let drawing = false;
    ctx.lineWidth = 8;
    ctx.lineCap = "round";
    ctx.strokeStyle = "#222";

    function getPos(e) {
      const rect = canvas.getBoundingClientRect();
      const touch = e.touches ? e.touches[0] : e;
      return {
        x: touch.clientX - rect.left,
        y: touch.clientY - rect.top
      };
    }

    function startDraw(e) {
      drawing = true;
      const pos = getPos(e);
      ctx.beginPath();
      ctx.moveTo(pos.x, pos.y);
    }

    function draw(e) {
      if (!drawing) return;
      e.preventDefault();
      const pos = getPos(e);
      ctx.lineTo(pos.x, pos.y);
      ctx.stroke();
    }

    function stopDraw() {
      drawing = false;
    }

    canvas.addEventListener("mousedown", startDraw);
    canvas.addEventListener("mousemove", draw);
    canvas.addEventListener("mouseup", stopDraw);
    canvas.addEventListener("mouseleave", stopDraw);
    canvas.addEventListener("touchstart", startDraw, { passive: false });
    canvas.addEventListener("touchmove", draw, { passive: false });
    canvas.addEventListener("touchend", stopDraw);

    function clearCanvas() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    clearBtn.onclick = clearCanvas;

    function loadNext() {
      if (queue.length === 0) {
        showDone();
        return;
      }
      current = queue.shift();
      kanjiEl.textContent = current.kanji;
      questionEl.textContent = current.q;
      clearCanvas();
      feedbackEl.textContent = "";
      feedbackEl.className = "feedback";
      updateProgress();
    }

    function updateProgress() {
      progressEl.textContent = `Correct: ${correctCount} / ${total}`;
    }

    function showDone() {
      document.getElementById("app").innerHTML = `
        <div class="done">✔</div>
        <div class="question">All done! Great job!</div>
        <div class="progress">You got all ${total} correct!</div>
      `;
    }

    async function recognizeNumber() {
      if (recognizing) return;
      recognizing = true;
      feedbackEl.textContent = "Reading...";
      feedbackEl.className = "feedback";
      try {
        const result = await Tesseract.recognize(canvas, "eng", {
          tessedit_char_whitelist: "0123456789"
        });
        const text = result.data.text.replace(/\D/g, "").trim();
        return text;
      } catch (err) {
        return "";
      } finally {
        recognizing = false;
      }
    }

    okBtn.onclick = async () => {
      if (!current || recognizing) return;
      const recognized = await recognizeNumber();
      if (recognized === current.a) {
        feedbackEl.textContent = "Correct!";
        feedbackEl.className = "feedback correct";
        correctCount++;
        setTimeout(loadNext, 800);
      } else {
        feedbackEl.textContent = recognized ? `I saw ${recognized}. Try again` : "Try again";
        feedbackEl.className = "feedback wrong";
        setTimeout(clearCanvas, 600);
      }
    };

    nextBtn.onclick = () => {
      if (!current) return;
      queue.push(current);
      loadNext();
    };

    loadNext();
  </script>
</body>
</html>
