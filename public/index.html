<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Emma Kanji Math</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Hiragino Maru Gothic Pro", "Yu Gothic", sans-serif;
      background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: white;
      border-radius: 30px;
      padding: 30px 20px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.15);
      max-width: 420px;
      width: 100%;
      text-align: center;
    }
    .mode-title {
      font-size: 20px;
      color: #666;
      margin-bottom: 5px;
    }
    .kanji {
      font-size: 90px;
      font-weight: bold;
      color: #333;
      margin: 5px 0 15px;
    }
    .question {
      font-size: 22px;
      margin: 10px 0 15px;
      color: #444;
    }
    #canvas {
      border: 3px solid #ddd;
      border-radius: 20px;
      background: #fafafa;
      touch-action: none;
      margin: 10px auto;
      display: block;
      cursor: crosshair;
    }
    .btn {
      border: none;
      border-radius: 20px;
      font-size: 22px;
      font-weight: bold;
      padding: 14px 20px;
      cursor: pointer;
      margin: 5px;
    }
    .ok-btn { background: #4caf50; color: white; }
    .clear-btn { background: #9e9e9e; color: white; }
    .next-btn {
      background: #ff9800;
      color: white;
      width: 70px;
      height: 70px;
      border-radius: 50%;
      font-size: 36px;
      display: block;
      margin: 15px auto 5px;
    }
    .feedback {
      font-size: 26px;
      margin: 15px 0 5px;
      min-height: 35px;
      font-weight: bold;
    }
    .feedback.good { color: #4caf50; }
    .feedback.try { color: #ff9800; }
    .progress {
      margin-top: 10px;
      font-size: 16px;
      color: #666;
    }
    .done {
      font-size: 48px;
      color: #4caf50;
      margin: 30px 0;
    }
    .buttons {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="card" id="app">
    <div class="mode-title" id="modeTitle">Kanji Practice</div>
    <div class="kanji" id="kanji">一</div>
    <div class="question" id="question">Write this Kanji</div>
    <canvas id="canvas" width="300" height="180"></canvas>
    <div class="buttons">
      <button class="btn clear-btn" id="clearBtn">Clear</button>
      <button class="btn ok-btn" id="okBtn">OK</button>
    </div>
    <button class="next-btn" id="nextBtn" title="Next">▶</button>
    <div class="feedback" id="feedback"></div>
    <div class="progress" id="progress"></div>
  </div>

  <script>
    const KANJI_LIST = [
      { kanji: "一", reading: "ichi", meaning: "one" },
      { kanji: "二", reading: "ni", meaning: "two" },
      { kanji: "三", reading: "san", meaning: "three" },
      { kanji: "四", reading: "shi", meaning: "four" },
      { kanji: "五", reading: "go", meaning: "five" },
      { kanji: "六", reading: "roku", meaning: "six" },
      { kanji: "七", reading: "nana", meaning: "seven" },
      { kanji: "八", reading: "hachi", meaning: "eight" },
      { kanji: "九", reading: "kyuu", meaning: "nine" },
      { kanji: "十", reading: "juu", meaning: "ten" }
    ];

    const MATH_LIST = [
      { kanji: "一", q: "1 + 1 = ?", a: "2" },
      { kanji: "二", q: "2 + 2 = ?", a: "4" },
      { kanji: "三", q: "3 + 1 = ?", a: "4" },
      { kanji: "四", q: "2 + 2 = ?", a: "4" },
      { kanji: "五", q: "3 + 2 = ?", a: "5" },
      { kanji: "六", q: "3 + 3 = ?", a: "6" },
      { kanji: "七", q: "4 + 3 = ?", a: "7" },
      { kanji: "八", q: "4 + 4 = ?", a: "8" },
      { kanji: "九", q: "5 + 4 = ?", a: "9" },
      { kanji: "十", q: "5 + 5 = ?", a: "10" }
    ];

    let mode = "kanji"; // or "math"
    let queue = [...KANJI_LIST];
    let current = null;
    let correctCount = 0;
    let total = KANJI_LIST.length;

    const modeTitle = document.getElementById("modeTitle");
    const kanjiEl = document.getElementById("kanji");
    const questionEl = document.getElementById("question");
    const feedbackEl = document.getElementById("feedback");
    const progressEl = document.getElementById("progress");
    const okBtn = document.getElementById("okBtn");
    const nextBtn = document.getElementById("nextBtn");
    const clearBtn = document.getElementById("clearBtn");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    let drawing = false;
    ctx.lineWidth = 8;
    ctx.lineCap = "round";
    ctx.strokeStyle = "#222";

    function getPos(e) {
      const rect = canvas.getBoundingClientRect();
      const touch = e.touches ? e.touches[0] : e;
      return { x: touch.clientX - rect.left, y: touch.clientY - rect.top };
    }

    function startDraw(e) {
      drawing = true;
      const pos = getPos(e);
      ctx.beginPath();
      ctx.moveTo(pos.x, pos.y);
    }

    function draw(e) {
      if (!drawing) return;
      e.preventDefault();
      const pos = getPos(e);
      ctx.lineTo(pos.x, pos.y);
      ctx.stroke();
    }

    function stopDraw() { drawing = false; }

    canvas.addEventListener("mousedown", startDraw);
    canvas.addEventListener("mousemove", draw);
    canvas.addEventListener("mouseup", stopDraw);
    canvas.addEventListener("mouseleave", stopDraw);
    canvas.addEventListener("touchstart", startDraw, { passive: false });
    canvas.addEventListener("touchmove", draw, { passive: false });
    canvas.addEventListener("touchend", stopDraw);

    function clearCanvas() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    clearBtn.onclick = clearCanvas;

    function loadNext() {
      if (queue.length === 0) {
        if (mode === "kanji") {
          // Switch to math
          mode = "math";
          queue = [...MATH_LIST];
          correctCount = 0;
          total = MATH_LIST.length;
          modeTitle.textContent = "Math Practice";
          loadNext();
          return;
        } else {
          showDone();
          return;
        }
      }
      current = queue.shift();
      kanjiEl.textContent = current.kanji;
      if (mode === "kanji") {
        questionEl.textContent = "Write this Kanji";
      } else {
        questionEl.textContent = current.q;
      }
      clearCanvas();
      feedbackEl.textContent = "";
      feedbackEl.className = "feedback";
      updateProgress();
    }

    function updateProgress() {
      progressEl.textContent = `Done: ${correctCount} / ${total}`;
    }

    function showDone() {
      document.getElementById("app").innerHTML = `
        <div class="done">✔</div>
        <div class="question">All done! Great job Emma!</div>
        <div class="progress">You finished both Kanji and Math!</div>
      `;
    }

    // Fun positive feedback for Kanji (no hard recognition for now)
    const niceMessages = ["Nice!", "Good job!", "Almost there!", "Looking good!", "Well done!"];

    okBtn.onclick = () => {
      if (!current) return;
      if (mode === "kanji") {
        // Always positive, never stuck
        const msg = niceMessages[Math.floor(Math.random() * niceMessages.length)];
        feedbackEl.textContent = msg;
        feedbackEl.className = "feedback good";
        correctCount++;
        setTimeout(loadNext, 700);
      } else {
        // Math still uses simple check for now
        feedbackEl.textContent = "Nice try!";
        feedbackEl.className = "feedback try";
        setTimeout(() => {
          queue.push(current);
          loadNext();
        }, 600);
      }
    };

    nextBtn.onclick = () => {
      if (!current) return;
      queue.push(current);
      loadNext();
    };

    loadNext();
  </script>
</body>
</html>
