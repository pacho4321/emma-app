<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>エマの漢字と九九</title>
  <link rel="stylesheet" href="app.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23ff4f93'/%3E%3C/svg%3E">
</head>
<body>
  <section id="gate" class="gate">
    <img class="gate-bunny" src="assets/bunny.webp" alt="">
    <p class="gate-lead">あいことば</p>
    <p class="gate-dots" id="gateDots" aria-hidden="true">○○○○○○</p>
    <p class="gate-msg" id="gateMsg" aria-live="polite"></p>
    <div class="gate-pad" id="gatePad"></div>
  </section>
  <div class="sky-bits" aria-hidden="true">
    <img class="bit bit-c1" src="assets/cloud-white.webp" alt="">
    <img class="bit bit-c2" src="assets/cloud-pink.webp" alt="">
    <img class="bit bit-c3" src="assets/cloud-purple.webp" alt="">
    <img class="bit bit-s1" src="assets/star-yellow.webp" alt="">
    <img class="bit bit-s2" src="assets/star-blue.webp" alt="">
    <img class="bit bit-s3" src="assets/star-pink.webp" alt="">
  </div>
  <section id="home" class="sky-home" hidden>
    <div class="sky-stage" id="skyStage">
      <img class="deco c-white" src="assets/cloud-white.webp" alt="">
      <img class="deco c-pink" src="assets/cloud-pink.webp" alt="">
      <img class="deco c-purple" src="assets/cloud-purple.webp" alt="">
      <img class="deco c-pink2" src="assets/cloud-pink.webp" alt="">
      <img class="deco s-y1" src="assets/star-yellow.webp" alt="">
      <img class="deco s-y2" src="assets/star-yellow.webp" alt="">
      <img class="deco s-b1" src="assets/star-blue.webp" alt="">
      <img class="deco s-b2" src="assets/star-blue.webp" alt="">
      <img class="deco s-p1" src="assets/star-pink.webp" alt="">
      <img class="deco s-p2" src="assets/star-pink.webp" alt="">
      <img class="deco d-bunny" src="assets/bunny.webp" alt="">
      <img class="deco d-banner" src="assets/banner-home.webp" alt="今日もがんばろう！">
      <h1 class="d-title"><img src="assets/title.webp" alt="エマの漢字と九九"></h1>
      <button type="button" id="logoutBtn" class="corner leave" aria-label="でる">でる</button>
      <button type="button" id="muteBtn" class="corner gear" aria-label="おと">⚙</button>
      <button type="button" id="parentBtn" class="corner parent" hidden>おや</button>
      <button type="button" id="moreBtn" class="corner more" aria-label="もっと">···</button>
      <button type="button" id="startKanji" class="art-btn kanji">
        <img src="assets/button-kanji.webp" alt="">
        <span class="btn-label"><span class="br">漢字</span><span class="pk">を</span><span class="pu">練習</span></span>
      </button>
      <button type="button" id="startMath" class="art-btn kuku" aria-label="九九を練習">
        <img src="assets/button-kuku.webp" alt="">
      </button>
      <button type="button" id="startSansu" class="sansu-home">算数練習</button>
      <button type="button" id="startBook" class="book-home">れんしゅうちょう</button>
    </div>
  </section>

  <main class="card" hidden>

    <section id="play" class="puri" hidden>
      <div class="puri-top">
        <button type="button" id="playBack" class="puri-back" aria-label="もどる">←</button>
        <div class="puri-brand">プリクラ ♥</div>
        <div class="puri-count" id="timer">5:00</div>
        <button type="button" id="puriGear" class="puri-gear" aria-label="デコ">⚙</button>
      </div>
      <h2 class="puri-title">かわいいプリクラつくろう♪</h2>
      <div class="puri-main">
        <div class="puri-col" id="puriLeft"></div>
        <div class="puri-stage" id="puriStage">
          <video id="video" playsinline autoplay muted hidden></video>
          <canvas id="puriView"></canvas>
          <button type="button" id="captureBtn" class="puri-shutter">とる</button>
          <div id="puriHandles" class="puri-handles" hidden>
            <button type="button" data-h="del" aria-label="けす">×</button>
            <button type="button" data-h="rot" aria-label="まわす">↻</button>
            <button type="button" data-h="scale" aria-label="おおきさ">＋</button>
            <button type="button" data-h="front" aria-label="まえ">前</button>
          </div>
        </div>
        <div class="puri-col" id="puriRight"></div>
      </div>
      <div class="puri-tray" id="puriTray" hidden></div>
      <div class="puri-pen">
        <button type="button" data-size="0.008" class="picked" aria-label="ほそい">細</button>
        <button type="button" data-size="0.016" aria-label="ふつう">中</button>
        <button type="button" data-size="0.03" aria-label="ふとい">太</button>
        <button type="button" id="puriGlitterPen" aria-label="きらきらペン">✦</button>
        <button type="button" id="puriEraser" aria-label="けしごむ">消</button>
        <button type="button" id="puriUndo" aria-label="もとにもどす">戻</button>
      </div>
      <div class="puri-colors" id="puriColors"></div>
      <div class="puri-actions">
        <button type="button" id="puriText"><img alt="" src="assets/purikura/icon-text.svg"><span>テキスト入力</span></button>
        <button type="button" id="puriSpark"><img alt="" src="assets/purikura/icon-spark.svg"><span>きらきらエフェクト</span></button>
        <button type="button" id="puriFilter"><img alt="" src="assets/purikura/icon-filter.svg"><span>フィルター</span></button>
        <button type="button" id="resetBtn"><img alt="" src="assets/purikura/icon-camera.svg"><span>カメラもどる</span></button>
      </div>
      <form id="puriTextForm" class="puri-textform" hidden>
        <input id="puriTextInput" maxlength="16" placeholder="もじ" autocomplete="off">
        <button type="submit">おく</button>
      </form>
      <img class="puri-bg" src="assets/purikura/bg.svg" alt="">
      <div class="puri-foot">
        <button type="button" id="puriHome" class="puri-home" aria-label="ホーム"><img alt="" src="assets/purikura/icon-home.svg"></button>
        <button type="button" id="puriPrint" class="puri-print"><img alt="" src="assets/purikura/icon-camera.svg"><span>プリントする♪</span></button>
        <button type="button" id="savePlay" class="puri-save"><img alt="" src="assets/purikura/icon-save.svg"><span>保存する</span></button>
      </div>
      <p id="cakes" hidden></p>
      <p id="soon" hidden></p>
      <p id="playNote" class="puri-note"></p>
      <input id="fileInput" type="file" accept="image/*" hidden>
    </section>

    <section id="study" hidden>
      <div class="study-head">
        <img class="mini-bunny" src="assets/bunny.webp" alt="">
        <div class="banner" id="modeTitle">かんじ</div>
        <img class="kuku-banner" id="kukuBanner" src="assets/banner-kuku.webp" alt="九九" hidden>
      </div>
      <img class="cheer" id="cheer" src="assets/banner-ganbatte.webp" alt="がんばってね！" hidden>
      <p class="hint-badge" id="hintBadge" hidden>ヒント 1</p>
      <div class="study-main">
        <div class="study-read">
          <p class="prompt" id="prompt">きいて、かんじを かこう</p>
          <p class="unit-mark" id="unitMark" hidden></p>
          <div class="question" id="question" hidden>2 × 3</div>
          <div class="equation" id="equation" hidden></div>
          <img class="apple-hint" id="appleHint" src="assets/apples.webp" alt="" hidden>
          <p class="reading" id="reading" hidden></p>
          <div class="kanji-prompt" id="kanjiPrompt" hidden>
            <p class="kanji-yomi" id="kanjiYomi"></p>
            <p class="kanji-slot"><span class="kanji-blank" aria-hidden="true"></span><span id="kanjiOkuri"></span></p>
          </div>
        </div>
        <div class="board-slot">
          <div class="masu" id="kanjiBoard">
            <div class="grid-v"></div>
            <div class="grid-h"></div>
            <canvas id="kanjiGuide" width="300" height="300"></canvas>
            <svg id="strokeSvg" class="stroke-svg" viewBox="0 0 109 109" aria-hidden="true"></svg>
            <canvas id="kanjiInk" width="300" height="300"></canvas>
          </div>
          <div class="math-board" id="mathBoard" hidden>
            <div class="baseline"></div>
            <canvas id="mathGuide" width="420" height="240"></canvas>
            <canvas id="mathInk" width="420" height="240"></canvas>
          </div>
        </div>
        <div class="study-controls">
          <div class="praise-stars" id="praiseStars" hidden>
            <img src="assets/star-yellow.webp" alt="">
            <img src="assets/star-pink.webp" alt="">
            <img src="assets/star-blue.webp" alt="">
          </div>
          <div class="feedback" id="feedback" aria-live="polite"></div>
          <div class="actions">
            <button type="button" id="clearBtn" class="btn amber">けす</button>
            <button type="button" id="doneBtn" class="btn green">OK</button>
            <button type="button" id="skipBtn" class="btn pink">スキップ</button>
          </div>
          <div class="listen">
            <div class="listen-sound">
              <button type="button" id="speakBtn" class="speak" aria-label="おと"><img src="assets/speaker.webp" alt=""></button>
              <div class="hint-label" id="listenLabel">おと</div>
            </div>
            <button type="button" id="strokeBtn" class="btn pink" hidden>かきじゅん</button>
          </div>
          <div class="progress" id="progress">あと 8 もん</div>
          <button type="button" id="backBtn" class="btn blue back">もどる</button>
        </div>
      </div>
      <p class="credit">かきじゅんのデータは KanjiVG（CC BY-SA）</p>
    </section>

    <section id="done" hidden>
      <div class="praise-stars" aria-hidden="true">
        <img src="assets/star-yellow.webp" alt="">
        <img src="assets/star-pink.webp" alt="">
        <img src="assets/star-blue.webp" alt="">
      </div>
      <div class="done-mark" aria-hidden="true">✨</div>
      <h2 class="done-title">すごい！じょうず！</h2>
      <p class="done-lead" id="doneLead">エマ、がんばったね</p>
      <button type="button" id="photoBtn" class="start">しゃしん あそび</button>
      <button type="button" id="bookBtn" class="btn pink">れんしゅうちょう</button>
      <button type="button" id="againBtn" class="start again">もういちど</button>
      <button type="button" id="homeBtn" class="btn blue back">おわる</button>
    </section>

    <section id="book" hidden>
      <div class="study-head">
        <img class="mini-bunny" src="assets/bunny.webp" alt="">
        <div class="banner">漢字練習帳</div>
      </div>
      <div class="book-tabs">
        <button type="button" id="bookTabKanji" class="chip picked">かんじ</button>
        <button type="button" id="bookTabMath" class="chip">九九・算数</button>
      </div>
      <p class="book-count" id="bookCount">かいた かんじ 0 / 103</p>
      <div class="book-bar" aria-hidden="true"><div id="bookBarFill"></div></div>
      <div class="book-grid" id="bookGrid"></div>
      <button type="button" id="bookHome" class="btn blue back">おわる</button>
    </section>

    <section id="parent" hidden>
      <div class="banner">おや</div>
      <p class="parent-lead">あたらしい こ</p>
      <input id="parentName" class="parent-input" maxlength="12" placeholder="なまえ" autocomplete="off">
      <input id="parentCode" class="parent-input" inputmode="numeric" maxlength="6" placeholder="6けた" autocomplete="off">
      <button type="button" id="parentAdd" class="btn green">ついか</button>
      <p class="parent-msg" id="parentMsg" aria-live="polite"></p>
      <p id="digitDebug" class="digit-debug">よみ: —</p>
      <div class="parent-list" id="parentList"></div>
      <button type="button" id="parentBack" class="btn blue back">もどる</button>
    </section>
  </main>

  <script src="curriculum.js"></script>
  <script src="strokes.js"></script>
  <script src="sound.js"></script>
  <script src="purikura.js"></script>
  <script src="app.js"></script>
</body>
</html>
