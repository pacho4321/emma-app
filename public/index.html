<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Emma Kanji Math</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Hiragino Maru Gothic Pro", "Yu Gothic", sans-serif;
      background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .card {
      background: white;
      border-radius: 28px;
      padding: 20px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.12);
      max-width: 400px;
      width: 100%;
      text-align: center;
    }
    .header {
      background: #ffd54f;
      border-radius: 16px;
      padding: 10px 16px;
      margin-bottom: 16px;
      font-weight: bold;
      font-size: 20px;
      color: #333;
    }
    .info {
      font-size: 15px;
      color: #555;
      margin-bottom: 8px;
      line-height: 1.4;
    }
    .kanji-big {
      font-size: 72px;
      font-weight: bold;
      color: #222;
      margin: 4px 0 12px;
    }
    .write-label {
      font-size: 18px;
      font-weight: bold;
      color: #333;
      margin-bottom: 8px;
    }
    #canvas {
      border: 3px solid #e0e0e0;
      border-radius: 18px;
      background: #fafafa;
      touch-action: none;
      margin: 0 auto 12px;
      display: block;
      cursor: crosshair;
    }
    .btn {
      border: none;
      border-radius: 18px;
      font-size: 20px;
      font-weight: bold;
      padding: 12px 18px;
      cursor: pointer;
      margin: 4px;
    }
    .ok-btn { background: #4caf50; color: white; }
    .clear-btn { background: #bdbdbd; color: white; }
    .next-btn {
      background: #ff9800;
      color: white;
      width: 64px;
      height: 64px;
      border-radius: 50%;
      font-size: 32px;
      display: block;
      margin: 12px auto 4px;
    }
    .feedback {
      font-size: 24px;
      margin: 10px 0 4px;
      min-height: 32px;
      font-weight: bold;
    }
    .feedback.good { color: #4caf50; }
    .progress {
      margin-top: 8px;
      font-size: 15px;
      color: #777;
    }
    .done {
      font-size: 48px;
      color: #4caf50;
      margin: 30px 0;
    }
    .buttons {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 6px;
    }
  </style>
</head>
<body>
  <div class="card" id="app">
    <div class="header" id="modeTitle">Write Kanji</div>
    <div class="info" id="info">一 (ichi) ・ one</div>
    <div class="kanji-big" id="kanji">一</div>
    <div class="write-label">Write Kanji</div>
    <canvas id="canvas" width="280" height="180"></canvas>
    <div class="buttons">
      <button class="btn clear-btn" id="clearBtn">Clear</button>
      <button class="btn ok-btn" id="okBtn">OK</button>
    </div>
    <button class="next-btn" id="nextBtn" title="Next">▶</button>
    <div class="feedback" id="feedback"></div>
    <div class="progress" id="progress"></div>
  </div>

  <script>
    const KANJI_LIST = [
      { kanji: "一", reading: "ichi", meaning: "one" },
      { kanji: "二", reading: "ni", meaning: "two" },
      { kanji: "三", reading: "san", meaning: "three" },
      { kanji: "四", reading: "shi / yon", meaning: "four" },
      { kanji: "五", reading: "go", meaning: "five" },
      { kanji: "六", reading: "roku", meaning: "six" },
      { kanji: "七", reading: "nana / shichi", meaning: "seven" },
      { kanji: "八", reading: "hachi", meaning: "eight" },
      { kanji: "九", reading: "kyuu / ku", meaning: "nine" },
      { kanji: "十", reading: "juu", meaning: "ten" }
    ];

    const MATH_LIST = [
      { kanji: "一", q: "1 + 1 = ?", a: "2" },
      { kanji: "二", q: "2 + 2 = ?", a: "4" },
      { kanji: "三", q: "3 + 1 = ?", a: "4" },
      { kanji: "四", q: "2 + 2 = ?", a: "4" },
      { kanji: "五", q: "3 + 2 = ?", a: "5" },
      { kanji: "六", q: "3 + 3 = ?", a: "6" },
      { kanji: "七", q: "4 + 3 = ?", a: "7" },
      { kanji: "八", q: "4 + 4 = ?", a: "8" },
      { kanji: "九", q: "5 + 4 = ?", a: "9" },
      { kanji: "十", q: "5 + 5 = ?", a: "10" }
    ];

    let mode = "kanji";
    let queue = [...KANJI_LIST];
    let current = null;
    let correctCount = 0;
    let total = KANJI_LIST.length;

    const modeTitle = document.getElementById("modeTitle");
    const infoEl = document.getElementById("info");
    const kanjiEl = document.getElementById("kanji");
    const questionEl = document.querySelector(".write-label");
    const feedbackEl = document.getElementById("feedback");
    const progressEl = document.getElementById("progress");
    const okBtn = document.getElementById("okBtn");
    const nextBtn = document.getElementById("nextBtn");
    const clearBtn = document.getElementById("clearBtn");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    let drawing = false;
    ctx.lineWidth = 7;
    ctx.lineCap = "round";
    ctx.strokeStyle = "#222";

    function getPos(e) {
      const rect = canvas.getBoundingClientRect();
      const touch = e.touches ? e.touches[0] : e;
      return { x: touch.clientX - rect.left, y: touch.clientY - rect.top };
    }

    function startDraw(e) {
      drawing = true;
      const pos = getPos(e);
      ctx.beginPath();
      ctx.moveTo(pos.x, pos.y);
    }

    function draw(e) {
      if (!drawing) return;
      e.preventDefault();
      const pos = getPos(e);
      ctx.lineTo(pos.x, pos.y);
      ctx.stroke();
    }

    function stopDraw() { drawing = false; }

    canvas.addEventListener("mousedown", startDraw);
    canvas.addEventListener("mousemove", draw);
    canvas.addEventListener("mouseup", stopDraw);
    canvas.addEventListener("mouseleave", stopDraw);
    canvas.addEventListener("touchstart", startDraw, { passive: false });
    canvas.addEventListener("touchmove", draw, { passive: false });
    canvas.addEventListener("touchend", stopDraw);

    function clearCanvas() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    clearBtn.onclick = clearCanvas;

    function loadNext() {
      if (queue.length === 0) {
        if (mode === "kanji") {
          mode = "math";
          queue = [...MATH_LIST];
          correctCount = 0;
          total = MATH_LIST.length;
          modeTitle.textContent = "Math Practice";
          loadNext();
          return;
        } else {
          showDone();
          return;
        }
      }
      current = queue.shift();
      kanjiEl.textContent = current.kanji;
      if (mode === "kanji") {
        infoEl.textContent = `${current.kanji} (${current.reading}) ・ ${current.meaning}`;
        questionEl.textContent = "Write Kanji";
        modeTitle.textContent = "Write Kanji";
      } else {
        infoEl.textContent = current.kanji;
        questionEl.textContent = current.q;
        modeTitle.textContent = "Math";
      }
      clearCanvas();
      feedbackEl.textContent = "";
      feedbackEl.className = "feedback";
      updateProgress();
    }

    function updateProgress() {
      progressEl.textContent = `Progress: ${correctCount} / ${total}`;
    }

    function showDone() {
      document.getElementById("app").innerHTML = `
        <div class="done">✔</div>
        <div class="question">All done! Great job Emma!</div>
        <div class="progress">You finished both Kanji and Math!</div>
      `;
    }

    const niceMessages = ["Nice!", "Good job!", "Looking good!", "Well done!", "Great!"];

    okBtn.onclick = () => {
      if (!current) return;
      const msg = niceMessages[Math.floor(Math.random() * niceMessages.length)];
      feedbackEl.textContent = msg;
      feedbackEl.className = "feedback good";
      correctCount++;
      setTimeout(loadNext, 700);
    };

    nextBtn.onclick = () => {
      if (!current) return;
      queue.push(current);
      loadNext();
    };

    loadNext();
  </script>
</body>
</html>
